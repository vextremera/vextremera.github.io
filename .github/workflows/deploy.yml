name: Publicar en GitHub Pages

# Cada empujón a main republica la web. workflow_dispatch deja lanzarlo a mano
# desde la pestaña Actions sin tener que inventarse un commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Los permisos mínimos que pide el despliegue: leer el código, escribir en
# Pages y firmar el despliegue con OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos cambios seguidos, el segundo espera en vez de pisar al
# primero. cancel-in-progress a false para no dejar un despliegue a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      # La web es HTML, CSS y JS sin compilar. Se copia a _site solo lo que
      # tiene que verse desde fuera, para no publicar el README ni la
      # configuración del repositorio.
      - name: Reunir los archivos de la web
        run: |
          mkdir _site
          cp index.html styles.css main.js _site/
          cp -r assets _site/

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
