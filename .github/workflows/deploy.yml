name: Publicar en GitHub Pages

# Cada empujón a main republica la web. workflow_dispatch deja lanzarlo a mano
# desde la pestaña Actions sin tener que inventarse un commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Los permisos mínimos que pide el despliegue: leer el código, escribir en
# Pages y firmar el despliegue con OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos cambios seguidos, el segundo espera en vez de pisar al
# primero. cancel-in-progress a false para no dejar un despliegue a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Construir el sitio
        uses: withastro/action@v3
        with:
          # El proyecto declara engines.node >= 22.12.
          node-version: 22

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
